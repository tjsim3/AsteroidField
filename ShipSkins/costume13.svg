<?xml version="1.0" encoding="UTF-8"?>
<!-- ======================================================
  CONCEPT 14: STARFIELD (detailed)
  A tiny night sky lives inside the hull - layered stars,
  4-point sparkle stars, soft nebula wisps, shooting
  stars with tails, all under a slow parallax drift.
  Clipped to hull. Shape = Scout (0.svg).
  ====================================================== -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     width="43.50001" height="30.22535" viewBox="0,0,43.50001,30.22535">
  <style>.hull { fill:#101a3a; } .shade { fill:#0a1228; } .glass { fill:#e4e7ff; } .nozzle { fill:#3b4069; }</style>
  <defs>
    <clipPath id="shipClip">
      <path d="M240.40845,184.18663l-8.27113,10.51761h-3.67606v-11.43662h-2.75704l-4.7993,4.7993h-2.65493v-16.89965h2.39965l4.85035,4.85035h3.16549v-10.82395l2.96127,-0.10211l8.88381,10.41549l21.23944,4.28873z"/>
    </clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <g transform="translate(-218.24999,-164.88734)" fill-rule="nonzero" stroke="none" stroke-width="0">
