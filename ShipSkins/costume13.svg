      <ellipse cx="226" cy="182" rx="7" ry="4" fill="#2a6a8a" filter="url(#soft)" opacity="0.25">
        <animate attributeName="opacity" values="0.18;0.34;0.18" dur="7s" begin="2s" repeatCount="indefinite"/>
      </ellipse>

      <!-- everything below drifts very slowly for parallax depth -->
      <g>
