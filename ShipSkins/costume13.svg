    <path class="shade" d="M239.6033,183.53019l-7.47508,8.90777h-3.52648v-9.27767l-3.00226,0.10211l-3.62261,3.55415h-2.39941v-14.31297h2.1687l3.77086,3.6995h3.26929v-8.75877l2.88049,-0.08648l8.02879,8.82129l19.19527,3.63229z"/>

    <g clip-path="url(#shipClip)">
      <!-- nebula wisps: deep blurred color clouds breathing slowly -->
      <ellipse cx="236" cy="176" rx="12" ry="6" fill="#3a4f9a" filter="url(#softer)" opacity="0.4">
        <animate attributeName="opacity" values="0.28;0.48;0.28" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="248" cy="184" rx="9" ry="5" fill="#6a3a8a" filter="url(#softer)" opacity="0.3">
